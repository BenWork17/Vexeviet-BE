# Local Infrastructure Only (MySQL + Redis, plus optional ngrok webhook tunnel)
# Application microservices run directly on host via `pnpm dev:services` without port collisions.
# To run containerized services instead, use: `pnpm docker:apps:up`

services:
  mysql:
    image: mysql:8.0.44-debian
    container_name: vexeviet-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vexeviet}
      MYSQL_USER: ${MYSQL_USER:-vexeviet_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-securepassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - vexeviet-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vexeviet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vexeviet-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ngrok:
    image: ngrok/ngrok:latest
    container_name: vexeviet-ngrok
    profiles: ["webhook"]
    restart: unless-stopped
    command:
      - "http"
      - "host.docker.internal:3004"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vexeviet-network

volumes:
  mysql_data:
  redis_data:

networks:
  vexeviet-network:
    driver: bridge
